# Configuração única do projeto: dependências fixadas, pytest e ruff.
#
# As versões são as que rodam HOJE (medidas com `pip freeze` em 23/09/2026) —
# o requirements.txt antigo dizia Flask 3.0.3 e pandas 2.2.2, mas o ambiente
# real já estava em Flask 3.1.3 e pandas 3.0.5. O golden master foi gerado com
# estas; trocar versão é mudança que precisa passar pelo golden.

# O projeto não é distribuído como pacote: o build-system existe só para que
# `pip install ".[dev]"` (usado no CI) instale as dependências fixadas abaixo.
# py-modules/packages vazios impedem o setuptools de tentar empacotar app/,
# tests/ e scripts/ (a detecção automática erra com várias pastas na raiz).
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
packages = []

[project]
name = "grupo-start-fechamento"
version = "0.1.0"
description = "Espelho do Tiny ERP para o fechamento gerencial do Grupo Start"
requires-python = ">=3.11"
dependencies = [
    "Flask==3.1.3",
    "Werkzeug==3.1.8",
    "Jinja2==3.1.6",
    "requests==2.34.2",
    "python-dotenv==1.2.3",
    "pandas==3.0.5",
    "openpyxl==3.1.5",
    "xlrd==2.0.2",
    "beautifulsoup4==4.15.0",
]

[project.optional-dependencies]
# Ferramentas de desenvolvimento e CI. Nunca instaladas no PythonAnywhere.
dev = [
    "pytest==9.1.1",
    "ruff==0.16.8",
    "pre-commit==4.6.2",
    "detect-secrets==1.5.0",
    "pip-audit==2.10.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "golden: golden master sobre o banco real congelado (só roda local; pula sem tests/golden/esperado/)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# O código existente não foi escrito sob ruff. A Fase 0 liga o lint com as
# regras que pegam BUG (pyflakes, erros de sintaxe, imports quebrados) e deixa
# o estilo para a Fase 1, que reorganiza tudo — reformatar agora geraria um
# diff gigante sem ganho e sujaria o histórico do golden.
extend-exclude = ["backups", "data", "Atualizar Sistema*"]

[tool.ruff.lint]
select = ["E9", "F", "B006", "B008"]

[tool.ruff.format]
# `ruff format --check` roda só nos arquivos novos da Fase 0 (tests/ e
# scripts/relatorio_qualidade.py), listados no CI e no pre-commit. O resto
# entra quando a Fase 1 reescrever cada módulo.
quote-style = "double"
